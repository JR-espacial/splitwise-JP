<!doctype html>
<html lang="es">
  <body style="margin:0;background:#f8f9ff;font-family:Arial,sans-serif;color:#0b1c30">
    <div style="max-width:480px;margin:0 auto;padding:40px 24px">
      <div style="background:#fff;border:1px solid #dde3eb;border-radius:24px;padding:32px;text-align:center">
        <p style="margin:0 0 8px;font-size:13px;font-weight:700;letter-spacing:.12em;color:#4b5970">EUROPA 2026</p>
        <h1 style="margin:0 0 16px;font-size:24px">Tu código de acceso</h1>
        <p style="margin:0 0 24px;line-height:1.6;color:#4b5970">Escribe este código en la app para iniciar sesión:</p>
        <p style="margin:0;padding:18px;border-radius:16px;background:#eff4ff;font-size:34px;font-weight:700;letter-spacing:.22em;color:#004ac6">{{ .Token }}</p>
        <p style="margin:24px 0 0;font-size:13px;line-height:1.6;color:#718096">Si no solicitaste este código, puedes ignorar este mensaje.</p>
      </div>
    </div>
  </body>
</html>
